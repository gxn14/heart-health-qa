<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心血管疾病患者居家心脏康复自我管理行为智能问答系统</title>
<style>
:root{--blue:#287cf0;--dark:#203452;--line:#dce8f8;--bg:#f4f8ff}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:linear-gradient(180deg,#eaf2ff,#f8fafc);color:#24364f}.app{max-width:960px;margin:40px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 12px 30px #3977b21c}.header{padding:28px;background:linear-gradient(#fff,#f3f8ff);border-bottom:1px solid var(--line)}h1{text-align:center;margin:0;color:#1d2f50;font-size:clamp(24px,4vw,36px)}.subtitle{text-align:center;color:#61738c;margin:10px 0 20px;font-weight:bold}.query{display:flex;gap:10px;max-width:760px;margin:auto;padding:9px 10px 9px 16px;background:#f8fbff;border:1px solid var(--line);border-radius:15px}.query input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px}.query button{border:0;border-radius:11px;padding:12px 20px;background:var(--blue);color:white;font-size:15px;font-weight:bold;cursor:pointer}.examples{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px}.examples button{border:1px solid #d8e6fb;background:#edf4ff;color:#3263a7;border-radius:20px;padding:8px 14px;cursor:pointer}.panel{padding:22px 28px}.title{font-size:19px;font-weight:bold;color:var(--dark);margin:0 0 14px}.answer{min-height:118px;padding:20px;background:linear-gradient(#fbfdff,#edf7ff);border:1px solid var(--line);border-radius:15px;line-height:1.9;font-size:16px}.graph{margin-top:22px;padding:20px;border:1px solid var(--line);border-radius:16px}.nodes{display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap;min-height:90px}.node{padding:15px 20px;border-radius:14px;background:#edf7ff;border:1px solid #cfe4fc;font-weight:bold;color:#31527a}.node.main{background:#fff4df;border-color:#f2d395}.node.green{background:#eafff3;border-color:#bce9d0}.source{color:#65758b;margin-top:18px;font-size:14px}@media(max-width:600px){.header,.panel{padding-left:16px;padding-right:16px}.query{flex-direction:column}.query button{width:100%}}
</style>
</head>
<body>
<main class="app"><section class="card"><header class="header"><h1>❤️ 心血管健康知识科普系统</h1><div class="subtitle">基于知识图谱的心力衰竭健康知识问答</div><div class="query"><input id="q" value="心力衰竭有哪些常见症状？" placeholder="请输入你的问题"><button onclick="ask()">🔍 提问</button></div><div class="examples"><button onclick="use(this)">什么是心力衰竭？</button><button onclick="use(this)">心力衰竭有哪些常见症状？</button><button onclick="use(this)">为什么要监测体重？</button><button onclick="use(this)">如何控制心力衰竭？</button></div></header><section class="panel"><h2 class="title">💡 科普回答</h2><div id="answer" class="answer">常见表现包括呼吸困难、乏力以及下肢水肿等。若症状加重，可能出现夜间憋醒、活动耐量下降或体重明显增加，需尽早就医评估。</div><div class="graph"><h2 class="title">🕸️ 相关知识</h2><div class="nodes"><div class="node main">心力衰竭</div><div class="node">呼吸困难</div><div class="node">乏力</div><div class="node green">下肢水肿</div></div></div><div class="source">📚 知识来源：相关健康科普资料</div></section></section></main>
<script>
const answers=[['什么是心力衰竭','心力衰竭是指心脏泵血功能下降，无法满足身体需要。它常见于高血压、冠心病、瓣膜病和心肌病等基础疾病之后。'],['症状','常见症状包括呼吸困难、乏力、活动耐量下降、夜间阵发性呼吸困难和下肢水肿。严重时还可能出现体重快速增加、食欲下降、心悸等表现。'],['体重','体重快速增加往往提示液体潴留，是心力衰竭病情变化的重要信号。建议每天固定时间监测体重，若短期增加明显，应及时联系医生。'],['控制','控制心力衰竭需要综合管理，包括遵医嘱服药、控制盐摄入、适度活动、监测体重和定期复查。']];function ask(){let q=document.getElementById('q').value, a=answers.find(x=>q.includes(x[0]));document.getElementById('answer').textContent=a?a[1]:'建议咨询医生或输入“症状”“体重”“控制”等相关问题。本文仅供健康科普，不能替代医生诊断。'}function use(e){document.getElementById('q').value=e.textContent;ask()}document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')ask()});ask();
</script>
</body></html>
