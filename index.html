<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>心血管疾病患者居家心脏康复自我管理行为智能问答系统</title>
  <style>
    /* Polished medical QA look: clean, calm colors, clear hierarchy, improved spacing */
    :root{
      --bg:#f6f8fb;
      --panel:#ffffff;
      --muted:#6b7a90;
      --accent:#2469f0;
      --accent-2:#3aa0ff;
      --success:#1a9a6f;
      --line:#e6eefc;
      --glass:rgba(255,255,255,0.6);
      --radius:16px;
      --shadow: 0 10px 30px rgba(29,42,58,0.08);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      background:linear-gradient(180deg, #f4f7fb 0%, var(--bg) 100%);
      color:#122033;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:28px;
    }

    .container{
      max-width:1200px;
      margin:0 auto;
      display:grid;
      grid-template-columns: 1fr 380px;
      gap:24px;
      align-items:start;
    }

    header.appbar{
      grid-column:1/-1;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      margin-bottom:6px;
    }

    .brand{
      display:flex;align-items:center;gap:12px
    }

    .logo{
      width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;box-shadow:0 6px 18px rgba(36,105,240,0.18)
    }

    .title {font-size:18px;font-weight:700}
    .subtitle{color:var(--muted);font-size:13px}

    .card{
      background:var(--panel);
      border-radius:var(--radius);
      padding:20px;
      box-shadow:var(--shadow);
      border:1px solid var(--line);
    }

    /* Left main panel */
    .main-card{padding:22px 22px 18px}

    .controls{
      display:flex;gap:12px;align-items:center;margin-bottom:18px
    }

    #questionInput{
      flex:1;height:52px;border-radius:12px;padding:12px 16px;border:1px solid var(--line);font-size:16px;background:linear-gradient(180deg,#fff,#fbfdff)
    }

    button#askBtn{height:52px;padding:0 18px;border-radius:12px;border:none;background:linear-gradient(180deg,var(--accent),var(--accent-2));color:#fff;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(36,105,240,0.18)}

    .hint {color:var(--muted);font-size:13px;margin-bottom:10px}

    .question-list{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
    .question-chip{background:#f5f9ff;border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-size:13px;color:#17314a;cursor:pointer;transition:all .12s}
    .question-chip:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(51,102,187,0.08)}
    .question-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

    .answer-box{margin-top:6px;padding:18px;border-radius:12px;background:linear-gradient(180deg,#fbfdff,#f7fbff);border:1px solid var(--line)}
    .answer-box h2{margin:0 0 10px;font-size:18px}
    .answer-content{font-size:15px;line-height:1.8;color:#182533}

    .answer-meta{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
    .node-badge{padding:6px 10px;border-radius:999px;background:#eef9f3;color:var(--success);border:1px solid rgba(26,154,111,0.12);font-weight:600;font-size:13px}

    /* Right sidebar */
    .sidebar{position:sticky;top:28px;align-self:start}
    .kg-preview{display:flex;flex-direction:column;gap:12px}
    .kg-preview img{width:100%;border-radius:10px;border:1px solid var(--line)}
    .kg-meta{font-size:13px;color:var(--muted)}

    /* subtle footer */
    footer.note{grid-column:1/-1;margin-top:18px;text-align:center;color:var(--muted);font-size:13px}

    @media (max-width:980px){
      .container{grid-template-columns:1fr;}
      .sidebar{position:relative;order:2}
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="appbar">
      <div class="brand">
        <div class="logo">心</div>
        <div>
          <div class="title">心血管疾病患者居家心脏康复自我管理问答</div>
          <div class="subtitle">基于知识图谱的智能问答 — 视觉更新（仅外观）</div>
        </div>
      </div>
      <div class="meta-info" aria-hidden>
        <span style="color:var(--muted);font-size:13px">已加载：知识图谱 + {问答条目数}</span>
      </div>
    </header>

    <main class="card main-card" aria-live="polite">
      <div class="hint">在下方输入问题或点击示例问题，系统将从知识库中检索最匹配的答案（说明：我不会修改问答逻辑或知识图谱图片）。</div>

      <div class="controls">
        <input id="questionInput" type="text" placeholder="请输入问题，例如：心力衰竭有哪些常见症状？" />
        <button id="askBtn">查询答案</button>
      </div>

      <div id="questionList" class="question-list" aria-label="常见问题"></div>

      <article id="answerBox" class="answer-box">
        <h2>系统已支持的问题</h2>
        <div class="answer-content">可在上方输入问题，或点击上方的示例问题标签快速查看对应答案。</div>
      </article>
    </main>

    <aside class="card sidebar">
      <div class="kg-preview">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <strong>知识图谱概览</strong>
          <span style="font-size:12px;color:var(--muted)">视觉展示</span>
        </div>
        <!-- 不修改图片文件，仅引用已有资源 -->
        <img src="/gxn14/heart-health-qa/knowledge-graph.svg" alt="知识图谱" />
        <div class="kg-meta">核心节点：自我管理行为 / 危险因素管理 / 心理管理 / 运动管理 / 饮食管理 / 药物管理</div>
      </div>
    </aside>

    <footer class="note">提示：页面样式已优化为医学问答风格；问答逻辑与知识图谱内容未被修改。</footer>
  </div>

  <script>
    /* --- 以下脚本保持原样（不改动问答逻辑） --- */
    const knowledgeData = {
      "title": "心血管疾病患者居家心脏康复自我管理知识图谱",
      "description": "根据用户提供的知识图谱图片整理。关系采用“包含”，子节点关系为“相关知识点”。图片中的部分小字可能存在识别误差，建议上线前核对。",
      "triples": [
        ["自我管理行为", "包含", "危险因素管理"],
        ["自我管理行为", "包含", "心理管理"],
        ["自我管理行为", "包含", "运动管理"],
        ["自我管理行为", "包含", "饮食管理"],
        ["自我管理行为", "包含", "药物管理"],
        ["危险因素管理", "包含", "风险清单"],
        ["危险因素管理", "包含", "戒烟支持"],
        ["危险因素管理", "包含", "血压管理"],
        ["危险因素管理", "包含", "血脂管理"],
        ["危险因素管理", "包含", "血糖管理"],
        ["危险因素管理", "包含", "体重评价"],
        ["心理管理", "包含", "心理疏导"],
        ["心理管理", "包含", "压力管理"],
        ["心理管理", "包含", "情绪表达"],
        ["心理管理", "包含", "专业支持"],
        ["心理管理", "包含", "家庭支持"],
        ["运动管理", "包含", "风险分层"],
        ["运动管理", "包含", "运动处方"],
        ["运动管理", "包含", "有氧运动"],
        ["运动管理", "包含", "抗阻训练"],
        ["运动管理", "包含", "运动反应"],
        ["运动管理", "包含", "自我监测"],
        ["运动管理", "包含", "团队联系"],
        ["饮食管理", "包含", "健康膳食"],
        ["饮食管理", "包含", "脂肪来源"],
        ["饮食管理", "包含", "膳食纤维"],
        ["饮食管理", "包含", "盐与液体"],
        ["饮食管理", "包含", "营养体重"],
        ["饮食管理", "包含", "膳食补充剂"],
        ["药物管理", "包含", "遵循处方"],
        ["药物管理", "包含", "用药计划"],
        ["药物管理", "包含", "用药依从"],
        ["药物管理", "包含", "用药记录"],
        ["药物管理", "包含", "安全监测"],
        ["药物管理", "包含", "按需用药"]
      ],
      "qa": [
        {
          "question": "心力衰竭有哪些常见症状？",
          "answer": "心力衰竭常见症状包括呼吸困难、乏力、活动耐量下降、夜间阵发性呼吸困难和下肢水肿。症状可能因人而异；若出现呼吸困难明显加重、胸痛、晕厥或短时间体重快速增加等情况，应及时联系医护人员或就医。",
          "relatedNodes": ["自我管理行为", "危险因素管理", "运动管理"]
        },
        {
          "question": "什么是心力衰竭？",
          "answer": "心力衰竭是指心脏泵血功能异常，导致心脏不能充分满足身体需要，或需要通过较高的充盈压力才能满足需要的一组临床综合征。具体诊断和治疗应由医务人员结合症状、体征及检查结果判断。",
          "relatedNodes": ["自我管理行为", "药物管理", "危险因素管理"]
        },
        {
          "question": "为什么要监测体重？",
          "answer": "对心力衰竭患者而言，定期监测体重有助于发现体液潴留的早期迹象。建议在相近时间、使用相同体重秤并穿着相近衣物测量，按医护人员给出的标准记录；若体重短时间明显增加，应按个体化管理方案联系医护人员。",
          "relatedNodes": ["危险因素管理", "体重评价", "饮食管理", "盐与液体"]
        },
        {
          "question": "如何控制心力衰竭？",
          "answer": "心力衰竭管理通常包括遵医嘱用药、监测症状和体重、按医护人员建议管理盐和液体摄入、进行适合自身情况的活动或康复训练，以及管理血压、血糖、血脂和体重。不要自行停药、增减药量或突然开展高强度运动。",
          "relatedNodes": ["药物管理", "饮食管理", "运动管理", "危险因素管理", "心理管理"]
        }
      ]
    };

    const questionInput = document.getElementById('questionInput');
    const askBtn = document.getElementById('askBtn');
    const questionList = document.getElementById('questionList');
    const answerBox = document.getElementById('answerBox');

    function renderQuestionChips() {
      const items = knowledgeData.qa;
      questionList.innerHTML = '';

      items.forEach((item, index) => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'question-chip';
        chip.textContent = item.question;
        chip.addEventListener('click', () => showQuestion(item.question, index));
        questionList.appendChild(chip);
      });
    }

    function showQuestion(questionText, activeIndex = -1) {
      const matched = knowledgeData.qa.find(item => item.question === questionText) || knowledgeData.qa.find(item => item.question.includes(questionText) || questionText.includes(item.question));

      if (!matched) {
        answerBox.innerHTML = `\n          <h2>未找到匹配答案</h2>\n          <div class="answer-content">当前系统已覆盖的主要问题包括：${knowledgeData.qa.map(item => item.question).join('；')}。如需进一步扩展，可继续补充新的知识条目。</div>\n        `;
        return;
      }

      const chips = document.querySelectorAll('.question-chip');
      chips.forEach((chip, idx) => {
        chip.classList.toggle('active', idx === activeIndex || chip.textContent === matched.question);
      });

      const nodeHtml = (matched.relatedNodes || []).map(node => `<span class="node-badge">${node}</span>`).join('');
      answerBox.innerHTML = `\n        <h2>${matched.question}</h2>\n        <div class="answer-content">${matched.answer}</div>\n        <div class="answer-meta">${nodeHtml}</div>\n      `;
    }

    function searchQuestion() {
      const keyword = questionInput.value.trim();
      if (!keyword) {
        answerBox.innerHTML = `\n          <h2>系统已支持的问题</h2>\n          <div class="answer-content">请输入问题后再查询，例如：心力衰竭有哪些常见症状？</div>\n        `;
        return;
      }

      const normalized = keyword.toLowerCase();
      const matched = knowledgeData.qa.find(item => {
        const q = item.question.toLowerCase();
        return q.includes(normalized) || normalized.includes(q);
      });

      if (matched) {
        const idx = knowledgeData.qa.findIndex(item => item.question === matched.question);
        showQuestion(matched.question, idx);
      } else {
        answerBox.innerHTML = `\n          <h2>未找到匹配答案</h2>\n          <div class="answer-content">当前系统暂无该问题的标准答案。建议参考知识图谱中的：自我管理行为、危险因素管理、心理管理、运动管理、饮食管理、药物管理等节点，并继续补充问答。</div>\n        `;
      }
    }

    askBtn.addEventListener('click', searchQuestion);
    questionInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        searchQuestion();
      }
    });

    renderQuestionChips();

    /* Update the header metadata number (visual only) */
    try{
      const metaSpan = document.querySelector('.meta-info span');
      if(metaSpan) metaSpan.textContent = `已加载：知识图谱 + ${knowledgeData.qa.length} 条问答`;
    }catch(e){/* ignore */}
  </script>
</body>
</html>
