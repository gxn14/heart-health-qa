<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>心血管疾病患者居家心脏康复自我管理知识问答</title>
  <style>
    :root{
      --bg-1:#edf5ff;
      --bg-2:#f9fbff;
      --panel:rgba(255,255,255,0.96);
      --line:rgba(90,130,190,0.18);
      --text:#18314a;
      --muted:#6682a0;
      --primary:#1d63df;
      --primary-2:#4aa9ff;
      --primary-3:#dfeeff;
      --success:#1c9c76;
      --radius-xl:18px;
      --shadow:0 12px 28px rgba(29,99,223,0.08);
      --soft-shadow:0 8px 20px rgba(82,133,206,0.08);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
      background:linear-gradient(180deg,var(--bg-1) 0%,var(--bg-2) 100%);
      color:var(--text);
    }

    .layout{
      max-width:1220px;
      margin:24px auto;
      display:grid;
      grid-template-columns:1fr 360px;
      gap:24px;
      padding:0 16px 28px;
    }

    .header{
      grid-column:1/-1;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      margin-bottom:8px;
      padding:8px 8px 0;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
      min-width:0;
    }

    .logo{
      width:56px;
      height:56px;
      border-radius:16px;
      background:linear-gradient(135deg,var(--primary),var(--primary-2));
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 10px 18px rgba(29,99,223,0.18);
      flex-shrink:0;
      overflow:hidden;
      border:1px solid rgba(255,255,255,0.35);
    }

    .logo img{ width:30px; height:30px; display:block; }

    .title{
      font-size:20px;
      font-weight:800;
      line-height:1.3;
      letter-spacing:0.2px;
    }

    .subtitle{
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }

    .panel{
      background:var(--panel);
      border-radius:var(--radius-xl);
      padding:18px;
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      backdrop-filter:blur(4px);
    }

    .main{
      padding:14px 16px 18px;
      background:linear-gradient(180deg,rgba(255,255,255,0.98),rgba(250,252,255,0.96));
    }

    .controls{
      display:flex;
      gap:12px;
      margin:16px 0 18px;
    }

    .search{
      flex:1;
      height:50px;
      padding:10px 16px;
      border-radius:14px;
      border:1px solid rgba(90,130,190,0.18);
      background:#fff;
      font-size:15px;
      color:var(--text);
      transition:border-color .2s ease, box-shadow .2s ease;
      outline:none;
    }

    .search:focus{
      border-color:rgba(29,99,223,0.45);
      box-shadow:0 0 0 3px rgba(29,99,223,0.08);
    }

    .btn{
      height:50px;
      padding:0 18px;
      border-radius:14px;
      border:none;
      background:linear-gradient(135deg,var(--primary),var(--primary-2));
      color:#fff;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 8px 18px rgba(29,99,223,0.18);
      transition:transform .15s ease, box-shadow .2s ease;
    }

    .btn:hover{ transform:translateY(-1px); }

    .qa-layout{
      display:grid;
      grid-template-columns:320px 1fr;
      gap:18px;
    }

    .question-list{
      max-height:56vh;
      overflow:auto;
      border-radius:14px;
      padding:12px;
      border:1px solid rgba(90,130,190,0.12);
      background:linear-gradient(180deg,#ffffff,#f7fbff);
    }

    .question-item{
      padding:11px 10px;
      border-radius:12px;
      margin-bottom:6px;
      cursor:pointer;
      color:var(--text);
      display:flex;
      align-items:flex-start;
      gap:10px;
      transition:background .18s ease, transform .15s ease;
    }

    .question-item:hover{
      background:linear-gradient(90deg,#f7fbff,#ffffff);
      transform:translateX(2px);
    }

    .question-item.active{
      background:linear-gradient(90deg,var(--primary),var(--primary-2));
      color:white;
      font-weight:700;
      box-shadow:0 6px 16px rgba(29,99,223,0.12);
    }

    .qid{
      min-width:32px;
      height:32px;
      border-radius:9px;
      background:rgba(29,99,223,0.08);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--primary);
      font-weight:700;
      font-size:13px;
      flex-shrink:0;
    }

    .question-item.active .qid{
      background:rgba(255,255,255,0.2);
      color:#fff;
    }

    .question-text{
      font-size:14px;
      line-height:1.5;
      word-break:break-word;
    }

    .answer-area{
      border-radius:16px;
      padding:18px 18px 16px;
      border:1px solid rgba(90,130,190,0.12);
      background:linear-gradient(180deg,#fbfdff,#ffffff);
      min-height:240px;
    }

    .answer-area h2{
      margin:0 0 10px;
      font-size:19px;
      line-height:1.35;
    }

    .answer-area .answer-body{ color:#1f364d; line-height:1.9; }
    .answer-area .answer-body p{ margin:0 0 10px; }
    .answer-area .answer-body p:last-child{ margin-bottom:0; }

    .refs{ margin-top:14px; font-size:13px; color:#7f8fa0; }
    .refs a{ color:#6b88c6; text-decoration:underline; }

    .no-results{
      padding:16px 14px;
      color:var(--muted);
      font-size:14px;
    }

    .note{
      margin-top:12px;
      color:var(--muted);
      font-size:13px;
      line-height:1.6;
    }

    .sidebar {
      padding:16px 16px 18px;
    }

    .sidebar-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:12px;
      gap:10px;
    }

    .sidebar-title{
      font-size:14px;
      color:var(--muted);
      font-weight:700;
      letter-spacing:0.2px;
    }

    .sidebar .img-grid{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
    }

    .img-box{
      border-radius:14px;
      overflow:hidden;
      border:1px solid rgba(90,130,190,0.12);
      background:#fff;
      max-width:320px;
      width:100%;
      box-shadow:var(--soft-shadow);
    }

    .img-box img{
      display:block;
      width:100%;
      height:auto;
    }

    @media(max-width:980px){
      .layout{ grid-template-columns:1fr; }
      .sidebar{ position:relative; }
      .qa-layout{ grid-template-columns:1fr; }
      .question-list{ max-height:none; }
      .header{ flex-wrap:wrap; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="header">
      <div class="brand">
        <div class="logo"><img src="assets/heart.svg" alt="爱心" /></div>
        <div>
          <div class="title">心血管疾病患者居家心脏康复自我管理知识问答</div>
          <div class="subtitle">基于国内外权威指南的心血管健康知识科普系统</div>
        </div>
      </div>
      <div class="subtitle">由心血管康复团队维护</div>
    </div>

    <main class="panel main" aria-live="polite">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px">
        <div>
          <strong style="font-size:16px;color:var(--muted)">心血管疾病患者居家心脏康复自我管理知识问答</strong>
          <div style="font-size:12px;color:var(--muted)">请点击左侧问题或在搜索框中输入关键词（例如：体重、运动、饮食、服药）</div>
        </div>

      <div class="controls">

        <button id="searchBtn" class="btn">搜索</button>

      <div class="qa-layout">
        <div>
          <div class="question-list panel" id="questionList" role="list" aria-label="问题列表">
            <!-- questions injected here -->
          </div>
          <div class="note" style="margin-top:8px">共有 <span id="totalCount">0</span> 个问题。点击问题查看答案，移动设备上为上下布局。</div>
        </div>

        <div>
          <section class="answer-area panel" id="answerArea" aria-live="polite">
            <h2>心血管疾病患者居家心脏康复自我管理知识问答</h2>
            <div class="answer-body" id="answerBody">
              <p>请选择左侧问题以查看答案，或通过搜索快速查找。</p>

            <div class="refs" id="refsArea" aria-label="参考文献"></div>
          </section>

      </div>
    </main>

    <aside class="panel sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">知识图谱与资源</div>
        <span style="font-size:12px;color:var(--muted)">概览</span>
      </div>

      <div class="img-grid">
        <div class="img-box"><img src="knowledge-graph.png.png" alt="知识图谱（PNG）" /></div>
      </div>

      <div class="note">图片由系统托管，页面仅作展示。QA 内容基于权威指南整理，供科普参考，不替代医疗诊断与个体化建议。</div>
    </aside>
  </div>

  <script>
    // Structured Q&A data (29 items) with id, question, answer, source array
    const QA_DATA = [
      {"id":1,"question":"心力衰竭是什么？","answer":"心力衰竭是由心脏结构或功能异常引起的一组临床综合征，可导致心脏充盈或泵血能力异常，并出现呼吸困难、乏力、液体潴留等表现。诊断需要结合病史、体格检查及相关检查，不能仅凭单一症状自行判断。","source":[{"name":"《中国心力衰竭诊断和治疗指南（2024）》","url":"https://csc.cma.org.cn/art/2024/4/18/art_619_56220.html"},{"name":"2022 AHA/ACC/HFSA Guideline for the Management of Heart Failure","url":"https://professional.heart.org/en/guidelines-statements/2022-ahaacchfsa-guideline-for-the-management-of-heart-failure-a-report-of-thecir0000000000001063"}]},
      {"id":2,"question":"心力衰竭有哪些常见症状？","answer":"心力衰竭常见症状包括呼吸困难、乏力、活动耐量下降、夜间阵发性呼吸困难和下肢水肿。症状可能因人而异；若出现呼吸困难明显加重、胸痛、晕厥或短时间体重快速增加等情况，应及时联系医护人员或就医。","source":[{"name":"《中国心力衰竭诊断和治疗指南（2024）》","url":"https://csc.cma.org.cn/art/2024/4/18/art_619_56220.html"},{"name":"2022 AHA/ACC/HFSA Guideline for the Management of Heart Failure","url":"https://professional.heart.org/en/guidelines-statements/2022-ahaacchfsa-guideline-for-the-management-of-heart-failure-a-report-of-thecir0000000000001063"}]},
      {"id":3,"question":"哪些情况需要尽快就医？","answer":"若出现严重或迅速加重的呼吸困难、持续胸痛、晕厥、意识异常或嘴唇发紫等情况，应立即寻求急诊就医。","source":[{"name":"心血管指南与临床建议","url":"https://example.org"}]},
      {"id":4,"question":"为什么心衰患者要每天监测体重？","answer":"体重在短期内上升可能提示体内液体潴留，是发现病情变化的一个线索。患者可以在固定时间测量并记录以便随访。","source":[{"name":"心衰管理要点","url":"https://example.org"}]},
      {"id":5,"question":"心衰患者怎样正确记录体重？","answer":"建议固定在每天早晨起床后、排尿后、早餐前测量，使用同一台体重秤并记录日期和体重数值。","source":[{"name":"心衰患者教育手册","url":"https://example.org"}]},
      {"id":6,"question":"心衰患者为什么要监测血压和心率？","answer":"血压和心率记录可帮助患者及医护人员了解身体变化，并辅助评估药物耐受性。测量方法应按医嘱进行。","source":[{"name":"血压管理指南","url":"https://example.org"}]},
      {"id":7,"question":"心衰患者需要限制盐吗？","answer":"许多心衰患者需要避免高盐饮食，因为钠摄入过多可能加重液体潴留。可减少腌制品、加工食品和高盐食品的摄入。","source":[{"name":"饮食与心衰","url":"https://example.org"}]},
      {"id":8,"question":"心衰患者每天能喝多少水？","answer":"液体摄入量需要个体化决定，并非所有心衰患者都必须严格限水。医生会结合症状、血钠等指标给出建议。","source":[{"name":"液体管理建议","url":"https://example.org"}]},
      {"id":9,"question":"心衰患者适合怎样的饮食？","answer":"总体可以选择蔬菜、水果、全谷物和适量优质蛋白等多样化食物，并减少高盐和高度加工食品。","source":[{"name":"营养指南","url":"https://example.org"}]},
      {"id":10,"question":"心衰患者需要服用营养补充剂吗？","answer":"不建议把营养补充剂当作心衰标准治疗，也不要自行使用所谓护心产品。部分补充剂需在医生指导下使用。","source":[{"name":"营养与补充剂","url":"https://example.org"}]},
      {"id":11,"question":"心衰患者为什么不能擅自停药？","answer":"心衰药物通常用于改善症状、减少住院风险或改善预后。擅自停药、减量或加量可能导致病情恶化。","source":[{"name":"用药管理","url":"https://example.org"}]},
      {"id":12,"question":"如何提高服药依从性？","answer":"可以使用药盒、手机提醒、固定服药时间表和用药清单，并在复诊时带上所有药物或药物照片。","source":[{"name":"用药依从性建议","url":"https://example.org"}]},
      {"id":13,"question":"心衰患者需要记录哪些用药信息？","answer":"建议记录药品名称、剂量、服用时间、近期调整、漏服情况及可能出现的不适，并及时与医护人员沟通。","source":[{"name":"用药记录指南","url":"https://example.org"}]},
      {"id":14,"question":"心衰患者可以运动吗？","answer":"病情稳定且经医护人员评估后，许多心衰患者可以参加适合自身能力的规律身体活动或心脏康复训练。","source":[{"name":"运动与康复","url":"https://example.org"}]},
      {"id":15,"question":"什么是心脏康复？","answer":"心脏康复是由专业团队指导的综合干预，通常包括运动训练、健康教育、危险因素管理、心理支持及随访。","source":[{"name":"心脏康复指南","url":"https://example.org"}]},
      {"id":16,"question":"心衰患者运动时要注意什么？","answer":"运动前应遵循康复团队制定的计划，循序渐进并做好热身和整理。运动中若出现胸痛、明显气促等应停止并就医。","source":[{"name":"运动安全","url":"https://example.org"}]},
      {"id":17,"question":"什么是有氧运动？","answer":"有氧运动是能持续一段时间、主要调动大肌群的活动，例如步行或固定自行车。是否适合需由专业评估决定。","source":[{"name":"运动种类说明","url":"https://example.org"}]},
      {"id":18,"question":"心衰患者可以做抗阻训练吗？","answer":"部分病情稳定的患者经专业评估后可以进行适度抗阻训练，但训练方式和强度需个体化。","source":[{"name":"抗阻训练建议","url":"https://example.org"}]},
      {"id":19,"question":"为什么运动前要做风险评估？","answer":"风险评估有助于了解患者当前症状、功能能力、合并症及运动相关风险，从而选择合适的运动处方。","source":[{"name":"风险评估","url":"https://example.org"}]},
      {"id":20,"question":"心衰患者怎样识别液体潴留？","answer":"可留意体重短期上升、脚踝或小腿水肿加重、腹胀、呼吸困难增加或夜间憋醒等变化。","source":[{"name":"液体潴留识别","url":"https://example.org"}]},
      {"id":21,"question":"吸烟会影响心衰管理吗？","answer":"吸烟会增加心血管风险。心衰患者应尽可能戒烟，并避免二手烟。","source":[{"name":"戒烟与心血管","url":"https://example.org"}]},
      {"id":22,"question":"饮酒对心衰患者安全吗？","answer":"是否需要完全避免饮酒取决于病因和病情。酒精可能影响部分药物和病情，建议咨询医生。","source":[{"name":"饮酒建议","url":"https://example.org"}]},
      {"id":23,"question":"心衰患者为什么需要管理血压、血糖和血脂？","answer":"高血压、糖尿病和血脂异常等合并问题可能影响心血管健康与整体预后。","source":[{"name":"危险因素管理","url":"https://example.org"}]},
      {"id":24,"question":"心衰患者如何管理压力和焦虑？","answer":"可以尝试与家人沟通、规律作息和放松训练，并向医护人员说明持续的焦虑或抑郁症状。","source":[{"name":"心理管理","url":"https://example.org"}]},
      {"id":25,"question":"家属可以怎样帮助心衰患者？","answer":"家属可以协助记录体重和症状、整理药物清单、陪同复诊、支持合理饮食和安全活动，并给予心理支持。","source":[{"name":"家庭支持","url":"https://example.org"}]},
      {"id":26,"question":"心衰患者为什么要定期复诊？","answer":"复诊可帮助评估症状、体征、血压、肾功能、电解质及治疗耐受性，并根据情况调整管理。","source":[{"name":"复诊建议","url":"https://example.org"}]},
      {"id":27,"question":"心衰患者感冒或感染时要注意什么？","answer":"感染可能诱发或加重心衰。若发热、咳嗽或其他感染症状伴随气促加重、明显乏力或意识改变，应及时就医。","source":[{"name":"感染管理","url":"https://example.org"}]},
      {"id":28,"question":"心衰患者可以自行调整利尿剂吗？","answer":"只有在医疗团队明确提供书面或清晰的个体化调整计划时，患者才应按照该计划行动。","source":[{"name":"利尿剂调整","url":"https://example.org"}]},
      {"id":29,"question":"如何建立家庭自我管理清单？","answer":"可将每日体重、症状变化、血压和心率（如医护人员建议）、服药情况、活动和饮食注意事项记录下来并随访。","source":[{"name":"自我管理清单","url":"https://example.org"}]}
    ];

    function textNodeLinesToParagraphs(container, text){
      container.innerHTML = '';
      const parts = String(text).split(/\n+/).map(s=>s.trim()).filter(Boolean);
      if(parts.length===0){
        const p = document.createElement('p'); p.textContent = ''; container.appendChild(p);
      } else {
        parts.forEach(ptext=>{ const p = document.createElement('p'); p.textContent = ptext; container.appendChild(p); });
      }
    }

    const questionListEl = document.getElementById('questionList');
    const totalCountEl = document.getElementById('totalCount');
    const answerBodyEl = document.getElementById('answerBody');
    const refsArea = document.getElementById('refsArea');

    let filtered = QA_DATA.slice();
    let activeId = null;

    function renderQuestionList(){
      questionListEl.innerHTML = '';
      filtered.forEach(item=>{
        const div = document.createElement('div'); div.className = 'question-item'; div.setAttribute('role','listitem'); div.dataset.id = item.id;
        if(item.id === activeId) div.classList.add('active');
        const qid = document.createElement('div'); qid.className='qid'; qid.textContent = item.id;
        const qtxt = document.createElement('div'); qtxt.className='question-text'; qtxt.textContent = item.question;
        div.appendChild(qid); div.appendChild(qtxt);
        div.addEventListener('click', ()=>{ showAnswerById(item.id); });
        questionListEl.appendChild(div);
      });
      totalCountEl.textContent = filtered.length;
      if(filtered.length===0){
        const no = document.createElement('div'); no.className='no-results'; no.textContent = '未找到匹配的问题。请尝试其他关键词。';
        questionListEl.appendChild(no);
      }
    }

    function showAnswerById(id){
      const item = QA_DATA.find(q=>q.id === id);
      if(!item) return;
      activeId = id;
      document.querySelectorAll('.question-item').forEach(el=>el.classList.toggle('active', Number(el.dataset.id)===id));
      textNodeLinesToParagraphs(answerBodyEl, item.answer);
      refsArea.innerHTML = '';
      const refTitle = document.createElement('div'); refTitle.style.fontWeight='700'; refTitle.style.marginBottom='6px'; refTitle.textContent = '参考来源：';
      refsArea.appendChild(refTitle);
      item.source.forEach(s=>{
        const link = document.createElement('div'); link.style.marginTop='6px';
        const a = document.createElement('a'); a.href = s.url; a.target='_blank'; a.rel='noopener noreferrer'; a.textContent = s.name;
        link.appendChild(a);
        refsArea.appendChild(link);
      });
      const activeEl = document.querySelector(`.question-item[data-id="${id}"]`);
      if(activeEl) activeEl.scrollIntoView({behavior:'smooth',block:'nearest'});
    }

    function performSearch(raw){
      const kw = String(raw || '').trim();
      if(!kw){ filtered = QA_DATA.slice(); renderQuestionList(); return; }
      const low = kw.toLowerCase();
      filtered = QA_DATA.filter(item=>item.question.toLowerCase().includes(low) || item.answer.toLowerCase().includes(low));
      const asNum = Number(kw);
      if(!isNaN(asNum) && asNum>0){ const direct = QA_DATA.find(q=>q.id===asNum); if(direct){ filtered = [direct]; }}
      renderQuestionList();
      if(filtered.length===1){ showAnswerById(filtered[0].id); }
    }

    document.getElementById('searchBtn').addEventListener('click', ()=>{ performSearch(document.getElementById('qinput').value); });
    document.getElementById('qinput').addEventListener('keydown', e=>{ if(e.key === 'Enter'){ performSearch(e.target.value); } });

    filtered = QA_DATA.slice(); renderQuestionList();
    (function checkHash(){
      try{
        const h = location.hash.replace('#',''); if(h){ const num = Number(h.replace(/^q/i,'')); if(!isNaN(num)){ const q = QA_DATA.find(it=>it.id===num); if(q){ showAnswerById(q.id); return; } }}
      } catch(e){}
      if(QA_DATA.length>0) showAnswerById(QA_DATA[0].id);
    })();
  </script>
</body>
</html>
