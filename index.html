<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>心血管疾病患者居家心脏康复自我管理行为智能问答系统</title>
  <style>
    :root {
      --bg: #edf4fb;
      --panel: #f4f8ff;
      --line: #dfeaf6;
      --blue: #3d77d1;
      --blue-dark: #0f2347;
      --blue-soft: #dfeffc;
      --text: #1e2d43;
      --muted: #6d87a8;
      --shadow: rgba(47, 88, 144, 0.14);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      background: #eef3f8;
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      padding: 20px 18px;
    }

    .app {
      width: min(1280px, 100%);
      background: rgba(255,255,255,0.35);
      border-radius: 18px;
      box-shadow: 0 12px 32px rgba(16, 28, 48, 0.06);
      overflow: hidden;
      border: 1px solid rgba(139, 166, 200, 0.24);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px 16px;
      background: rgba(255,255,255,0.5);
      border-bottom: 1px solid #dfeaf6;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 16px;
      color: var(--text);
      font-weight: 700;
    }

    .header-title .crumb {
      color: var(--muted);
      font-weight: 500;
      opacity: 0.9;
    }

    .search-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid #d6e7fb;
      background: rgba(255,255,255,0.45);
      color: #2a5ea8;
      font-size: 14px;
      font-weight: 600;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3);
    }

    .qa-shell {
      padding: 18px 22px 10px;
      background: var(--panel);
    }

    .qa-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(141, 164, 195, 0.2);
      border-radius: 18px;
      padding: 14px 14px 10px;
    }

    .qa-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      color: var(--muted);
      padding: 6px 10px 0;
    }

    .qa-box {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 18px;
      padding: 0 10px 8px;
    }

    .chat-box {
      background: rgba(255,255,255,0.45);
      border: 1px solid #dfeaf6;
      border-radius: 14px;
      padding: 18px;
      min-height: 220px;
    }

    .chat-box h2 {
      margin: 0 0 14px;
      font-size: 18px;
      color: var(--text);
    }

    .bubble {
      max-width: 90%;
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.7;
      font-size: 14px;
      background: #edf6ff;
      border: 1px solid #dfeaf7;
      color: #234784;
    }

    .bubble.user {
      margin-left: auto;
      background: #eef4ff;
    }

    .bubble.ai {
      margin-right: auto;
      background: #f3f8ff;
    }

    .ask-box {
      background: rgba(255,255,255,0.42);
      border: 1px solid #dfeaf6;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 220px;
    }

    .ask-box h3 {
      margin: 0;
      font-size: 16px;
      color: var(--text);
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 7px 10px;
      border-radius: 999px;
      background: #edf5ff;
      border: 1px solid #dfeaf7;
      color: var(--blue);
      font-size: 12px;
    }

    .example-answer {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #f9fbff, #edf5ff);
      border: 1px dashed #d7e6f8;
      border-radius: 12px;
      color: #3f6bb3;
      font-weight: 600;
      text-align: center;
      padding: 16px;
    }

    .knowledge-wrapper {
      padding: 0 18px 18px;
      background: var(--panel);
    }

    .knowledge-card {
      background: rgba(255,255,255,0.55);
      border: 1px solid #dfeaf6;
      border-radius: 16px;
      padding: 10px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
    }

    .knowledge-card img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      background: #f6f9ff;
    }

    @media (max-width: 860px) {
      .qa-box {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="header-title">
        <span>知识图谱</span>
        <span class="crumb">/</span>
        <span class="crumb">本体关系</span>
      </div>
      <button class="search-btn" type="button">🔎 搜索知识点</button>
    </header>

    <div class="qa-shell">
      <div class="qa-panel">
        <div class="qa-header">
          <span>智能问答系统</span>
          <span>基于知识图谱</span>
        </div>

        <div class="qa-box">
          <div class="chat-box">
            <h2>问答示例</h2>
            <div class="bubble user">请问，什么是心力衰竭？</div>
            <div class="bubble ai">心力衰竭是指心脏泵血功能下降，无法满足机体的代谢需要，常见于高血压、冠心病、瓣膜病和心肌病等基础疾病之后。</div>
          </div>

          <div class="ask-box">
            <h3>常见问题</h3>
            <div class="chip-list">
              <span class="chip">高血压管理</span>
              <span class="chip">运动康复</span>
              <span class="chip">饮食指导</span>
              <span class="chip">心理调节</span>
              <span class="chip">药物管理</span>
            </div>
            <div class="example-answer">支持心血管疾病患者居家心脏康复自我管理问答</div>
          </div>
        </div>
      </div>
    </div>

    <div class="knowledge-wrapper">
      <div class="knowledge-card">
        <img src="./knowledge-map.svg" alt="心血管疾病患者自我管理知识图谱" />
      </div>
    </div>
  </main>
</body>
</html>
