<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>心血管健康知识图谱</title>
  <style>
    :root {
      --bg: #eef5ff;
      --panel: #ffffff;
      --line: #dbe9f9;
      --text: #203452;
      --muted: #5b738c;
      --blue: #2e7ae7;
      --soft-blue: #dfeefb;
      --navy: #0d2d5a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(180deg, #edf3ff 0%, #f4f8ff 100%);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--text);
      padding: 24px;
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      background: rgba(255,255,255,0.78);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(24, 67, 128, 0.08);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 26px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.4);
    }

    .title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 1px;
    }

    .title-badge {
      font-size: 14px;
      color: var(--blue);
      background: #edf5ff;
      border: 1px solid #cfe3ff;
      border-radius: 999px;
      padding: 5px 10px;
      font-weight: 500;
    }

    .search-btn {
      border: 1px solid #cfe1ff;
      background: linear-gradient(180deg, #f7fbff 0%, #edf5ff 100%);
      color: var(--blue);
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(46, 122, 231, 0.08);
    }

    .knowledge-panel {
      padding: 18px 12px 12px;
      background: #f4f8ff;
    }

    .knowledge-panel img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      background: #edf4ff;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="title">
        <span>知识图谱</span>
        <span class="title-badge">本体关系</span>
      </div>
      <button class="search-btn">🔍 搜索知识节点</button>
    </div>

    <div class="knowledge-panel">
      <img src="./knowledge-graph.svg" alt="心血管健康知识图谱" />
    </div>
  </div>
</body>
</html>
